<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Design and download premium PnL cards for your trades. Cards are drawn in your browser and saved to your account."
    />
    <title>Astra — PnL cards</title>
    <!-- Paints the page's own ground before any stylesheet lands. -->
    <style>
      html {
        background: #000000;
        color-scheme: dark;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights actually drawn: 300 for the wordmark, 400 for the
         title, rows, handle and footer, 800 for the value in the accent block,
         and 500/600/700 for the editor's own chrome. Asking for 900, or for
         JetBrains Mono Bold, cost a font file nothing ever rendered with. -->
    <!-- The chosen theme's ground, before anything else, so a dark one never
         flashes light. Written by `lib/siteTheme.ts`. -->
    <script>
      try {
        var boot = JSON.parse(localStorage.getItem('astra:site-theme-boot') || 'null');
        if (boot) {
          document.documentElement.style.background = boot.bg;
          document.documentElement.style.colorScheme = boot.dark ? 'dark' : 'light';
        }
      } catch (e) {}
    </script>
    <!-- Satoshi is the site's own type. The card keeps drawing in Inter. -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
