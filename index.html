<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Design and download premium PnL cards for your trades. Cards are drawn in your browser and saved to your account."
    />
    <title>PnL Card Studio</title>
    <!-- Paints the page's own ground before any stylesheet lands, so the load
         never flashes white on the way to a near-black editor. -->
    <style>
      html {
        background: #06070a;
        color-scheme: dark;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights actually drawn: 300 for the wordmark, 400 for the
         title, rows, handle and footer, 800 for the value in the accent block,
         and 500/600/700 for the editor's own chrome. Asking for 900, or for
         JetBrains Mono Bold, cost a font file nothing ever rendered with. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
